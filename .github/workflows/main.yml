name: Deploy to S3

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::042505434065:role/GitHubActionsS3DeployRole
          aws-region: ap-south-1

      - name: Deploy to S3
        run: aws s3 sync . s3://github-to-s3-project-yash --delete --exclude ".git/*" --exclude ".github/*"
